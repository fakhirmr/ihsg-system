name: Macro Daily (08:00 WIB)

on:
  schedule:
    - cron: '0 1 * * 1-5'   # 08:00 WIB = 01:00 UTC, Senin–Jumat
  workflow_dispatch:          # bisa juga dijalankan manual

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Runner GitHub default UTC; semua jadwal di kode ini WIB
    env:
      TZ: Asia/Jakarta

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore agent cache
        uses: actions/cache@v4
        with:
          path: |
            data/agent_cache.json
          key: ihsg-macro-${{ github.run_id }}
          restore-keys: |
            ihsg-macro-

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Watchlist tidak disimpan di repo — ia berasal dari jurnal mentor.
      # Runner mengambilnya dari Actions variable WATCHLIST (hanya terlihat
      # pemilik repo) dan menuliskannya sebelum job jalan.
      - name: Siapkan watchlist
        env:
          WATCHLIST: ${{ vars.WATCHLIST }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          raw = os.environ.get("WATCHLIST", "").strip()
          if not raw:
              raise SystemExit("Variable WATCHLIST kosong — set di Settings > Secrets and variables > Actions > Variables")
          codes = json.loads(raw)
          rows = [{"code": c, "added": "", "source": "variable", "last_journal": None} for c in codes]
          p = pathlib.Path("data/watchlist.json")
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps({"updated": "", "tickers": rows}, indent=1), encoding="utf-8")
          print(f"watchlist: {len(codes)} emiten")
          PY

      - name: Run Macro Agent
        env:
          LLM_PROVIDER:        ${{ secrets.LLM_PROVIDER }}
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_job.py --job macro
