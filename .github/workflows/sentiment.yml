name: News Sentiment Scan (setiap jam, jam pasar)

on:
  schedule:
    # Setiap jam dari 09:00–16:00 WIB (02:00–09:00 UTC), Senin–Jumat
    - cron: '0 2,3,4,5,6,7,8,9 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Runner GitHub default UTC; semua jadwal di kode ini WIB
    env:
      TZ: Asia/Jakarta

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore agent cache
        uses: actions/cache@v4
        with:
          path: |
            data/agent_cache.json
          key: ihsg-sentiment-${{ github.run_id }}
          restore-keys: |
            ihsg-sentiment-

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Watchlist tidak disimpan di repo — ia berasal dari jurnal mentor.
      # Runner mengambilnya dari Actions SECRET WATCHLIST (disamarkan di log,
      # hanya terlihat pemilik repo) lalu menuliskannya sebelum job jalan.
      - name: Siapkan watchlist
        env:
          WATCHLIST: ${{ secrets.WATCHLIST }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          raw = os.environ.get("WATCHLIST", "").strip()
          if not raw:
              raise SystemExit("Secret WATCHLIST kosong — set lewat: gh secret set WATCHLIST")
          codes = json.loads(raw)
          rows = [{"code": c, "added": "", "source": "variable", "last_journal": None} for c in codes]
          p = pathlib.Path("data/watchlist.json")
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps({"updated": "", "tickers": rows}, indent=1), encoding="utf-8")
          print(f"watchlist: {len(codes)} emiten")
          PY

      - name: Run Sentiment Scan
        env:
          LLM_PROVIDER:        ${{ secrets.LLM_PROVIDER }}
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_job.py --job sentiment
